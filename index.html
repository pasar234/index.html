<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toko Full</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512x512.png">

    <style>
        /* CSS Tambahan agar tampilan seperti aplikasi native */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <script>
        /**
         * REGISTRASI SERVICE WORKER
         * Agar aplikasi bisa diinstall dan berjalan secara offline (Syarat PWA)
         */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: '/tokofull/' })
                    .then(reg => {
                        console.log('SW Berhasil didaftarkan pada scope:', reg.scope);
                    })
                    .catch(err => {
                        console.error('SW Gagal didaftarkan:', err);
                    });
            });
        }

        /**
         * FUNGSI TAMBAHAN (Opsional)
         * Mencegah refresh yang tidak disengaja saat di-swipe ke bawah pada Android
         */
        document.addEventListener('touchmove', function (e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
